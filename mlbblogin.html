<!DOCTYPE html>
<html>
    <head>
        <title>Mission Town Demo Login</title>
    </head>
    <body>
        <h2>Account Creation Form</h2>
        <form action="Login-Confirmed.html" method="get">
            <fieldset>
                <legend>Login Information</legend>
                <label for = "first-name">First Name:</label>
                <input type = "text" class = "name-field" id = "first-name" name = "fn" placeholder = "Enter your first name" minlength="3" required />
                <br/>
                <label for = "last-name">Last Name:</label>
                <input type = "text" class = "name-field" id = "last-name" name = "ln" placeholder = "Enter your last name" minlength="3" required />
            </fieldset>
            <br/>
            <label for = "age">Age:</label>
            <input type = "number" id="age" name="age" placeholder="Enter your age" min="18" max="100" style="width: 150px;" required />
            <br/>
            <label for = "gender">Gender:</label>
            <input type = "radio" name="gender" id="male"/>male
            <input type = "radio" name="gender" id="female"/>female
            <input type = "radio" name="gender" id="other"/>other
            <select>
                <option value="">Select your gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <br/>
            <label for="email">Email:</label>
            <input type="email" id="email" name="em" placeholder="Enter your email" required />
            <br/>
            <label for="password">Password:</label>
            <input type="password" id="password" name="pw" placeholder="Enter your password" required />
            <br/>
            <label for="confirm-password">Confirm password:</label>
            <input type="password" id="confirm-password" name="cp" placeholder="Confirm your password" required />
            <br/>
            <input type="checkbox" /> Agree to <a href="terms.html">Terms & Conditions</a>
            <br/>
            <textarea name="" id="" style="width: 300px;"></textarea>
            <br/>
            <button>Create Account</button>
            <br/>
            <br/>
            <input type="submit" value="Create Your Account" />
            <input type="reset" />
        </form>
    </body>
</html>
